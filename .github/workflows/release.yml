name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, Attest and Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Portable Application (Single-File)
        shell: pwsh
        run: |
          dotnet publish TrayFolderFlyout.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./Publish/App
          New-Item -ItemType Directory -Force -Path ./Release
          Copy-Item ./Publish/App/TrayFolderFlyout.exe ./Release/TrayFolderFlyout_Portable.exe
          Compress-Archive -Path ./Release/TrayFolderFlyout_Portable.exe -DestinationPath ./Release/TrayFolderFlyout_Portable.zip -Force

      - name: Build Setup Installer
        shell: pwsh
        run: |
          dotnet publish TrayFolderFlyout.Setup/TrayFolderFlyout.Setup.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o ./Release

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $hashes = Get-FileHash -Algorithm SHA256 ./Release/*.exe, ./Release/*.zip | Select-Object Hash, @{Name="File";Expression={Split-Path $_.Path -Leaf}}
          $lines = $hashes | ForEach-Object { "$($_.Hash)  $($_.File)" }
          $lines | Set-Content -Path ./Release/checksums_sha256.txt -Encoding utf8
          Write-Host "Generated SHA256 checksums:"
          Get-Content ./Release/checksums_sha256.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ./Release/TrayFolderFlyout_Setup.exe
            ./Release/TrayFolderFlyout_Portable.exe
            ./Release/TrayFolderFlyout_Portable.zip

      - name: VirusTotal Analysis
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v5
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ./Release/TrayFolderFlyout_Setup.exe
            ./Release/TrayFolderFlyout_Portable.exe
            ./Release/TrayFolderFlyout_Portable.zip
          update_release_body: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./Release/TrayFolderFlyout_Setup.exe
            ./Release/TrayFolderFlyout_Portable.exe
            ./Release/TrayFolderFlyout_Portable.zip
            ./Release/checksums_sha256.txt
          generate_release_notes: true
